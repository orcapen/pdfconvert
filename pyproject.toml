[project]
name = "pdfconvert"
version = "0.1.0"
description = "將 PPTX 與 DOCX 依指定順序轉換並合併為 PDF 的桌面工具"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pypdf>=5.0",
    "pyside6>=6.8",
    "pywin32>=308; sys_platform == 'win32'",
]

[project.gui-scripts]
pdfconvert = "pdfconvert.app:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdfconvert"]

[tool.pytest.ini_options]
testpaths = ["tests"]

